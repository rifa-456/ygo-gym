[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "ygo-gym"
version = "0.1.0"
description = "Yu-Gi-Oh! environment for game AI research"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dataset = ["duckdb>=1.5.6,<2", "pyarrow>=22"]

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}/{build_type}"
wheel.packages = ["src/ygo_gym"]

[dependency-groups]
benchmark = [
    "pyperf>=2.10,<3",
    "psutil>=7.0",
    "rich>=14,<15",
]
test = [
    "pytest>=8.4",
    "hypothesis>=6.140",
]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -ra"
