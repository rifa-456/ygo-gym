[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "ygo-gym"
version = "0.1.0"
description = "Yu-Gi-Oh! environment for game AI research"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
wheel.packages = ["src/ygo_gym"]

[dependency-groups]
test = [
    "pytest>=8.4",
    "hypothesis>=6.140",
]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -ra"
