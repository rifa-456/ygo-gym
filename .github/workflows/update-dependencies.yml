name: Update dependencies

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'rifa-456/ygo-gym' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare dependency candidates
        id: prepare
        run: python .github/scripts/dependency_updates prepare .dependency-update
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: dependency-candidate
          path: .dependency-update/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      candidate_artifact: dependency-candidate

  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dependency-candidate
          path: .dependency-update
      - name: Publish tested commits
        env:
          UPSTREAM_UPDATE_TOKEN: ${{ secrets.UPSTREAM_UPDATE_TOKEN }}
        run: python .github/scripts/dependency_updates publish .dependency-update
