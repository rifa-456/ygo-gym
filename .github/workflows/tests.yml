name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_artifact:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14", "3.15"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: .upstream-core
      - name: Check out candidate commits
        if: inputs.candidate_artifact != ''
        run: uv run --no-project --python "${{ matrix.python }}" python .github/scripts/upstream_core checkout .upstream-core
      - name: Build package and install test dependencies
        run: uv sync --locked --group test --python "${{ matrix.python }}" --reinstall-package ygo-gym
      - name: Run Python tests
        run: uv run --locked --group test --python "${{ matrix.python }}" pytest --junitxml=.reports/pytest.xml
      - name: Upload test report and failing generated examples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .reports/
            .hypothesis/examples/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  core:
    name: Native core integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: .upstream-core
      - name: Check out candidate commits
        if: inputs.candidate_artifact != ''
        run: python .github/scripts/upstream_core checkout .upstream-core
      - name: Configure core tests
        run: >-
          cmake -S third_party/ygopro-core/clone/tests -B build/core-tests
          -DCMAKE_BUILD_TYPE=Release
          -DCARDSCRIPTS_DIR="${{ github.workspace }}/third_party/CardScripts"
      - name: Build core tests
        run: cmake --build build/core-tests --parallel 2
      - name: Run core tests
        run: |
          cmake -E make_directory .reports
          ctest --test-dir build/core-tests --output-on-failure --no-tests=error --output-junit "${{ github.workspace }}/.reports/core.xml"
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-linux
          path: .reports/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
