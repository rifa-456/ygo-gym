name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_artifact:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14", "3.15"]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: .dependency-update
      - name: Check out candidate commits
        if: inputs.candidate_artifact != ''
        run: uv run --no-project --python "${{ matrix.python }}" python .github/scripts/dependency_updates checkout .dependency-update
      - name: Build package and install test dependencies
        run: uv sync --locked --group test --python "${{ matrix.python }}" --reinstall-package ygo-gym
      - name: Run Python tests
        run: uv run --locked --group test --python "${{ matrix.python }}" pytest --junitxml=.reports/pytest.xml
      - name: Install dataset tools
        if: matrix.python == '3.14'
        run: uv sync --locked --group test --extra dataset --python "${{ matrix.python }}"
      - name: Test dataset and task APIs
        if: matrix.python == '3.14'
        run: uv run --no-sync pytest tests/dataset tests/task tests/persistence
      - name: Install benchmark tools
        if: matrix.python == '3.14'
        run: uv sync --locked --group test --group benchmark --python "${{ matrix.python }}"
      - name: Test benchmark tooling
        if: matrix.python == '3.14'
        run: uv run --no-sync pytest tests/benchmarks
      - name: Smoke test benchmark runners
        if: matrix.python == '3.14'
        run: |
          uv run --locked --group test --group benchmark --python "${{ matrix.python }}" python -m benchmarks.cloning timing --scenario simple --mode exact --debug-single-value --loops 1 --output .reports/cloning-timing-smoke.json
          uv run --locked --group test --group benchmark --python "${{ matrix.python }}" python -m benchmarks.cloning memory --scenario simple --mode exact --counts 2 --repetitions 1 --output .reports/cloning-memory-smoke.json
          uv run --no-sync python -m benchmarks.cloning profile --iterations 2 --warmups 1 --quiet --output .reports/cloning-profile-smoke.json
      - name: Smoke test checkpoint benchmarks
        if: matrix.python == '3.14'
        run: uv run --no-sync python -m benchmarks.cloning timing --operation restore-all --scenario suspended --mode exact --debug-single-value --loops 1 --output .reports/checkpoint-timing-smoke.json
      - name: Upload test report and failing generated examples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .reports/
            .hypothesis/examples/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  core:
    name: Native core and scripts / UBSan ${{ matrix.ubsan }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubsan: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: .dependency-update
      - name: Check out candidate commits
        if: inputs.candidate_artifact != ''
        run: python .github/scripts/dependency_updates checkout .dependency-update
      - name: Configure core tests
        run: >-
          cmake -S tests/assets/native -B build/core-tests
          -DCMAKE_BUILD_TYPE=Release
          -DOCG_CLONE_UBSAN=${{ matrix.ubsan }}
          -DCARDSCRIPTS_DIR="${{ github.workspace }}/third_party/CardScripts"
      - name: Build core tests
        run: cmake --build build/core-tests --parallel 2
      - name: Run core tests
        run: |
          cmake -E make_directory .reports
          ctest --test-dir build/core-tests --output-on-failure --no-tests=error --output-junit "${{ github.workspace }}/.reports/core.xml"
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-linux-ubsan-${{ matrix.ubsan }}
          path: .reports/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  profiling:
    name: Clone diagnostics / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: .dependency-update
      - name: Check out candidate commits
        if: inputs.candidate_artifact != ''
        run: uv run --no-project --python 3.14 python .github/scripts/dependency_updates checkout .dependency-update
      - name: Build optimized diagnostic extension with symbols
        run: uv sync --locked --group test --group benchmark --python 3.14 --reinstall-package ygo-gym --config-setting "cmake.define.YGO_PROFILE_SYMBOLS=ON" --config-setting "cmake.define.YGO_CLONE_DIAGNOSTICS=ON" --config-setting "install.strip=false" --config-setting "build-dir=build/clone-diagnostics/{wheel_tag}"
      - name: Run tests with diagnostics compiled in
        run: uv run --no-sync pytest --junitxml=.reports/profiling.xml
      - name: Exercise diagnostic report
        run: >-
          uv run --no-sync python -m benchmarks.cloning profile
          --scenario suspended --mode seeded --iterations 3 --warmups 1
          --diagnostics --quiet --output .reports/clone-diagnostics.json
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clone-diagnostics-${{ matrix.os }}
          path: .reports/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  windbot:
    name: WindBot / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      YGO_TEST_WINDBOT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
      - uses: actions/download-artifact@v4
        if: inputs.candidate_artifact != ''
        with:
          name: ${{ inputs.candidate_artifact }}
          path: .dependency-update
      - name: Check out candidate commits
        if: inputs.candidate_artifact != ''
        run: uv run --no-project --python "3.14" python .github/scripts/dependency_updates checkout .dependency-update
      - name: Build native extension and install test tools
        run: uv sync --locked --group test --python "3.14"
      - name: Build WindBot worker
        run: uv run --no-sync python -m ygo_gym.agents.windbot build
      - name: Test WindBot integration
        run: uv run --no-sync pytest tests/agents/windbot
